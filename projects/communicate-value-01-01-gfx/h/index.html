<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>01_01 horizontal, ben's graphics</title>
    <script src="gsap.min.js"></script>
    <style>
      body { margin: 0; background: #212121; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #212121; }
      #bg { position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover;
             filter: blur(36px) brightness(0.38) saturate(0.8); }
      #win { position: absolute; top: 0; left: 541px; width: 838px; height: 1080px; overflow: hidden; background: #000; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 28%; }
      #a-roll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
      #bar { position: absolute; top: 0; left: 0; width: 106px; height: 1080px; background: #212121; }
      .gw { position: absolute; inset: 0; clip-path: inset(0 0 0 944px); }
      .gf { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="144.63">
      <video id="bg" class="clip" src="assets/cut.mp4" muted playsinline data-start="0" data-duration="144.63" data-track-index="0"></video>
      <div id="win">
        <div id="cam">
          <video id="a-roll" class="clip" src="assets/cut.mp4" playsinline data-has-audio="true" data-start="0" data-duration="144.63" data-track-index="1" data-volume="1"></video>
        </div>
      </div>
      <div id="bar"></div>
      <div class="gw" id="g-title">
        <video id="h-title" class="clip gf" src="assets/retimed/h_title.mov" muted playsinline data-start="0.0" data-duration="7.0" data-track-index="10"></video>
      </div>
      <div class="gw" id="g-emotions">
        <video id="h-emotions" class="clip gf" src="assets/retimed/h_emotions.mov" muted playsinline data-start="15.6" data-duration="9.7" data-track-index="11"></video>
      </div>
      <div class="gw" id="g-lesson">
        <video id="h-lesson" class="clip gf" src="assets/retimed/h_lesson.mov" muted playsinline data-start="29.6" data-duration="6.7" data-track-index="12"></video>
      </div>
      <div class="gw" id="g-deeper">
        <video id="h-deeper" class="clip gf" src="assets/retimed/h_deeper.mov" muted playsinline data-start="36.8" data-duration="38.6" data-track-index="13"></video>
      </div>
      <div class="gw" id="g-funnel">
        <video id="h-funnel" class="clip gf" src="assets/retimed/h_funnel.mov" muted playsinline data-start="80.8" data-duration="7.4" data-track-index="14"></video>
      </div>
      <div class="gw" id="g-carts">
        <video id="h-carts" class="clip gf" src="assets/retimed/h_carts.mov" muted playsinline data-start="98.0" data-duration="19.3" data-track-index="15"></video>
      </div>
      <div class="gw" id="g-yes">
        <video id="h-yes" class="clip gf" src="assets/retimed/h_yes.mov" muted playsinline data-start="117.6" data-duration="6.2" data-track-index="16"></video>
      </div>
      <div class="gw" id="g-ear">
        <video id="h-ear" class="clip gf" src="assets/retimed/h_ear.mov" muted playsinline data-start="140.6" data-duration="4.03" data-track-index="17"></video>
      </div>
      <div id="fade"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      const poses = [[0.0, 10.1, 1.0, 1.05, 0.8, -0.8], [10.1, 15.45, 1.1, 1.15, -0.8, 0.8], [15.45, 29.75, 1.0, 1.05, 0, 0], [29.75, 36.7, 1.1, 1.15, 0.8, -0.8], [36.7, 43.6, 1.0, 1.05, -0.8, 0.8], [43.6, 49.65, 1.1, 1.15, 0, 0], [49.65, 56.85, 1.0, 1.05, 0.8, -0.8], [56.85, 63.95, 1.1, 1.15, -0.8, 0.8], [63.95, 75.6, 1.0, 1.05, 0, 0], [75.6, 123.93, 1.1, 1.15, 0.8, -0.8], [123.93, 134.68, 1.0, 1.05, -0.8, 0.8], [134.68, 140.63, 1.1, 1.15, 0, 0], [140.63, 144.63, 1.0, 1.05, 0.8, -0.8]];
      poses.forEach(([a, b, s0, s1, x0, x1]) => {
        tl.set("#cam", { scale: s0, xPercent: x0 }, a);
        tl.to("#cam", { scale: s1, xPercent: x1, duration: b - a, ease: "sine.inOut" }, a);
      });
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 144.13);

      tl.to("#g-title", {x: 976, duration: 0.4, ease: "power2.in"}, 6.6);
      tl.fromTo("#g-emotions", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 15.6);
      tl.to("#g-emotions", {x: 976, duration: 0.4, ease: "power2.in"}, 24.9);
      tl.fromTo("#g-lesson", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 29.6);
      tl.to("#g-lesson", {x: 976, duration: 0.4, ease: "power2.in"}, 35.9);
      tl.fromTo("#g-deeper", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 36.8);
      tl.to("#g-deeper", {x: 976, duration: 0.4, ease: "power2.in"}, 75.0);
      tl.fromTo("#g-funnel", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 80.8);
      tl.to("#g-funnel", {x: 976, duration: 0.4, ease: "power2.in"}, 87.8);
      tl.fromTo("#g-carts", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 98.0);
      tl.to("#g-carts", {x: 976, duration: 0.4, ease: "power2.in"}, 116.9);
      tl.fromTo("#g-yes", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 117.6);
      tl.to("#g-yes", {x: 976, duration: 0.4, ease: "power2.in"}, 123.4);
      tl.fromTo("#g-ear", {x: 976}, {x: 0, duration: 0.45, ease: "power3.out"}, 140.6);
      tl.set("#win", {x: -435}, 0); tl.set("#bar", {x: 0}, 0);
      tl.to("#win", {x: 0, duration: 0.55, ease: "power3.inOut"}, 6.6);
      tl.to("#bar", {x: -106, duration: 0.4, ease: "power2.in"}, 6.6);
      tl.fromTo("#win", {x: 0}, {x: -435, duration: 0.45, ease: "power3.out"}, 15.6);
      tl.fromTo("#bar", {x: -106}, {x: 0, duration: 0.45, ease: "power3.out"}, 15.6);
      tl.to("#win", {x: 0, duration: 0.55, ease: "power3.inOut"}, 24.9);
      tl.to("#bar", {x: -106, duration: 0.4, ease: "power2.in"}, 24.9);
      tl.fromTo("#win", {x: 0}, {x: -435, duration: 0.45, ease: "power3.out"}, 29.6);
      tl.fromTo("#bar", {x: -106}, {x: 0, duration: 0.45, ease: "power3.out"}, 29.6);
      tl.to("#win", {x: 0, duration: 0.55, ease: "power3.inOut"}, 75.0);
      tl.to("#bar", {x: -106, duration: 0.4, ease: "power2.in"}, 75.0);
      tl.fromTo("#win", {x: 0}, {x: -435, duration: 0.45, ease: "power3.out"}, 80.8);
      tl.fromTo("#bar", {x: -106}, {x: 0, duration: 0.45, ease: "power3.out"}, 80.8);
      tl.to("#win", {x: 0, duration: 0.55, ease: "power3.inOut"}, 87.8);
      tl.to("#bar", {x: -106, duration: 0.4, ease: "power2.in"}, 87.8);
      tl.fromTo("#win", {x: 0}, {x: -435, duration: 0.45, ease: "power3.out"}, 98.0);
      tl.fromTo("#bar", {x: -106}, {x: 0, duration: 0.45, ease: "power3.out"}, 98.0);
      tl.to("#win", {x: 0, duration: 0.55, ease: "power3.inOut"}, 123.4);
      tl.to("#bar", {x: -106, duration: 0.4, ease: "power2.in"}, 123.4);
      tl.fromTo("#win", {x: 0}, {x: -435, duration: 0.45, ease: "power3.out"}, 140.6);
      tl.fromTo("#bar", {x: -106}, {x: 0, duration: 0.45, ease: "power3.out"}, 140.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
